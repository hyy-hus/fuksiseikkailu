version: "3.9"

services:
  web:
    build:
      context: ./server
    container_name: web
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env.dev
    depends_on:
      - db
    volumes:
      - ./server:/app

  frontend:
    build:
      context: ./client
    container_name: client
    ports:
      - "3007:80"
    depends_on:
      - web

  db:
    image: postgres:17
    container_name: db
    restart: always
    env_file:
      - ./server/.env.dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

